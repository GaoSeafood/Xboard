name: Deploy production from GitHub source

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xboard-production
  cancel-in-progress: false

jobs:
  build-source:
    name: Build source for production architectures
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Verify release worker safety checks
        run: python3 -m unittest discover -s deploy/tests -v
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        with:
          platforms: linux/arm64,linux/amd64
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build the exact GitHub commit without publishing an image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          platforms: linux/arm64,linux/amd64
          push: false
          provenance: false
          build-args: |
            REPO_URL=https://github.com/${{ github.repository }}.git
            SOURCE_SHA=${{ github.sha }}

  deploy:
    name: Deploy verified source to Oracle
    needs: [build-source]
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      # Compare against the RUNNING release on the server. Workflow-only commits
      # must not suppress a retry of application changes missed earlier.
      - name: Queue exact source revision and wait for production verification
        env:
          DEPLOY_SECRET: ${{ secrets.DEPLOY_HOOK_SECRET }}
          REPOSITORY: ${{ github.repository }}
          REF: ${{ github.ref }}
          TARGET_SHA: ${{ github.sha }}
          DELIVERY_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: node deploy/request-release.mjs
