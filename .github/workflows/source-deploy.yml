name: Deploy production from GitHub source

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xboard-production
  cancel-in-progress: false

jobs:
  build-source:
    name: Build source for production architectures
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        with:
          platforms: linux/arm64,linux/amd64
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build the exact GitHub commit without publishing an image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          platforms: linux/arm64,linux/amd64
          push: false
          provenance: false
          build-args: |
            REPO_URL=https://github.com/${{ github.repository }}.git
            SOURCE_SHA=${{ github.sha }}

  deploy:
    name: Deploy verified source to Oracle
    needs: [build-source]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - name: Check whether application source changed
        id: scope
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          before_sha="$BEFORE_SHA"
          if [[ -z "$before_sha" || "$before_sha" =~ ^0+$ ]]; then
            before_sha="$(git rev-parse "$TARGET_SHA^" 2>/dev/null || true)"
          fi
          if [[ -z "$before_sha" ]]; then
            changed_files="$(git diff-tree --no-commit-id --name-only -r "$TARGET_SHA")"
          else
            changed_files="$(git diff --name-only "$before_sha" "$TARGET_SHA")"
          fi
          echo "before_sha=$before_sha" >> "$GITHUB_OUTPUT"
          if grep -Eiv '^(\.github/|docs/|README([^/]*)?$|AGENTS\.md$|CONTRIBUTING\.md$|.*\.md$)' <<<"$changed_files" | grep -q .; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Queue signed deployment and wait for server health checks
        if: steps.scope.outputs.changed == 'true'
        env:
          DEPLOY_SECRET: ${{ secrets.DEPLOY_HOOK_SECRET }}
          REPOSITORY: ${{ github.repository }}
          REF: ${{ github.ref }}
          BEFORE_SHA: ${{ steps.scope.outputs.before_sha }}
          TARGET_SHA: ${{ github.sha }}
          DELIVERY_ID: ${{ github.run_id }}
        run: |
          node --input-type=module <<'NODE'
          import { createHmac } from 'node:crypto'
          const secret = process.env.DEPLOY_SECRET
          if (!secret || secret.length < 32) throw new Error('deployment secret is not configured')
          const payload = {
            repository: { full_name: process.env.REPOSITORY },
            ref: process.env.REF,
            before: process.env.BEFORE_SHA,
            after: process.env.TARGET_SHA,
          }
          const body = JSON.stringify(payload)
          const signature = 'sha256=' + createHmac('sha256', secret).update(body).digest('hex')
          const accepted = await fetch('https://ad.gaoseafood.com/api/deploy-hook/xboard', {
            method: 'POST',
            headers: {
              'content-type': 'application/json',
              'x-github-event': 'push',
              'x-github-delivery': process.env.DELIVERY_ID,
              'x-hub-signature-256': signature,
            },
            body,
          })
          const receipt = await accepted.json()
          if (!accepted.ok || receipt.queued !== true) throw new Error('server did not queue the deployment')
          const statusUrl = new URL('https://ad.gaoseafood.com/api/deploy-hook/xboard/status')
          statusUrl.searchParams.set('sha', process.env.TARGET_SHA)
          for (let attempt = 0; attempt < 300; attempt++) {
            const response = await fetch(statusUrl, { headers: { 'x-deploy-token': secret } })
            const state = await response.json()
            if (!response.ok) throw new Error('server deployment status could not be read')
            if (state.status === 'succeeded') {
              console.log('Production deployment succeeded for ' + state.sha)
              process.exit(0)
            }
            if (state.status === 'failed') throw new Error('Production deployment failed: ' + (state.message || 'see server deployment logs'))
            await new Promise(resolve => setTimeout(resolve, 10000))
          }
          throw new Error('Timed out waiting for the server deployment')
          NODE
