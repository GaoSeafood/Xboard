name: Deploy production from GitHub source

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xboard-source-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-source:
    name: Build source for production architectures
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Verify release worker safety checks
        run: python3 -m unittest discover -s deploy/tests -v
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        with:
          platforms: linux/arm64,linux/amd64
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build the exact GitHub commit without publishing an image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          platforms: linux/arm64,linux/amd64
          push: false
          provenance: false
          build-args: |
            REPO_URL=https://github.com/${{ github.repository }}.git
            SOURCE_SHA=${{ github.sha }}

  deploy:
    name: Deploy verified source to Oracle
    needs: [build-source]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 85
    environment:
      name: xboard-production
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: xboard-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Connect to the private server network
        uses: tailscale/github-action@99a8333667fff04fdd6cffb46dfd409f8329a7bf # v4
        with:
          oauth-client-id: ${{ vars.TS_OAUTH_CLIENT_ID }}
          audience: ${{ vars.TS_AUDIENCE }}
          tags: tag:tingjian-ci
          ping: 100.78.228.11
      - name: Deploy the verified commit over restricted SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          BEFORE_SHA: ${{ github.event.before }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          private_key_file="$(mktemp "$HOME/.ssh/deploy-key.XXXXXX")"
          known_hosts_file="$(mktemp "$HOME/.ssh/known-hosts.XXXXXX")"
          trap 'rm -f "$private_key_file" "$known_hosts_file"' EXIT
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$private_key_file"
          chmod 600 "$private_key_file"
          unset DEPLOY_SSH_KEY
          printf '%s\n' '217.142.236.67 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIN3QjQrhuDcmqAnqsFLgevYPee3JoRkh+R8qR20AI7jP' > "$known_hosts_file"
          if [[ "$BEFORE_SHA" =~ ^[a-fA-F0-9]{40}$ ]]; then
            deploy_command="deploy $TARGET_SHA $BEFORE_SHA"
          else
            deploy_command="deploy $TARGET_SHA"
          fi
          ssh -i "$private_key_file" -o BatchMode=yes -o ConnectTimeout=20 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$known_hosts_file" -o HostKeyAlias=217.142.236.67 tingjian-deploy@100.78.228.11 "$deploy_command"
