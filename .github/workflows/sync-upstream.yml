name: Sync upstream

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: xboard-upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - name: Check out the fork
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: master
          fetch-depth: 0

      - name: Merge upstream without overwriting fork changes
        id: merge
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/cedar2025/Xboard.git

          # Refresh the fork first. --ff-only refuses unexpected divergence.
          git pull --ff-only origin master
          git fetch upstream master --no-tags

          if ! git merge-base HEAD upstream/master >/dev/null; then
            echo "The fork and upstream do not share a merge base; stopping without changes." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          upstream_commits="$(git rev-list --count HEAD..upstream/master)"
          if [[ "$upstream_commits" == 0 ]]; then
            echo "No upstream commits to merge." >> "$GITHUB_STEP_SUMMARY"
            echo "merged=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! git merge --no-edit --no-ff upstream/master; then
            conflicts="$(git diff --name-only --diff-filter=U || true)"
            {
              echo "## Upstream sync stopped"
              echo
              if [[ -n "$conflicts" ]]; then
                echo "The ordinary Git merge found conflicts. No changes were pushed or deployed. Resolve these files and rerun the workflow:"
                echo
                printf '%s\n' "$conflicts" | sed 's/^/- /'
              else
                echo "Git could not complete the merge. No changes were pushed or deployed. Review the log before retrying."
              fi
            } >> "$GITHUB_STEP_SUMMARY"
            git merge --abort || true
            exit 1
          fi

          if ! git push origin HEAD:master; then
            echo "The normal push was rejected, likely because master changed during the merge. No force push was attempted." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          echo "merged=true" >> "$GITHUB_OUTPUT"
          {
            echo "## Upstream sync merged"
            echo
            echo "Merged $upstream_commits upstream commits into the fork with an ordinary Git merge."
            echo "Fork commit: \`$(git rev-parse --short HEAD)\`."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build and deploy the merged source
        if: steps.merge.outputs.merged == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run source-deploy.yml --repo "$GH_REPO" --ref master
