name: Docker Build and Publish

on:
  push:
    branches: ["master", "new-dev"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1 

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: 'arm64,amd64'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          platforms: linux/amd64,linux/arm64
          driver-opts: |
            image=moby/buildkit:v0.20.0
            network=host

      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af

      - name: Login to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,format=short,prefix=,enable=true
            type=raw,value=new,enable=${{ github.ref == 'refs/heads/master' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}
            type=raw,value=${{ steps.get_version.outputs.version }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Get version
        id: get_version
        run: echo "version=$(git describe --tags --always)" >> $GITHUB_OUTPUT

      - name: Update version in app.php
        run: |
          VERSION=$(date '+%Y%m%d')-$(git rev-parse --short HEAD)
          sed -i "s/'version' => '.*'/'version' => '$VERSION'/g" config/app.php
          echo "Updated version to: $VERSION"

      - name: Build and push
        id: build-and-push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILDKIT_INLINE_CACHE=1
            BUILDKIT_MULTI_PLATFORM=1
            CACHEBUST=${{ github.sha }}
            REPO_URL=https://github.com/${{ github.repository }}
            BRANCH_NAME=${{ github.ref_name }}
          provenance: false
          outputs: type=registry,push=true
          allow: |
            network.host


  deploy:
    name: Deploy production after image publish
    needs: [build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Check whether application source changed
        id: scope
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          changed_files="$(git diff --name-only "$BEFORE_SHA" "$TARGET_SHA")"
          if grep -Eiv '^(\.github/|docs/|README([^/]*)?$|AGENTS\.md$|CONTRIBUTING\.md$|.*\.md$)' <<<"$changed_files" | grep -q .; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Queue signed deployment and wait for the server
        if: steps.scope.outputs.changed == 'true'
        env:
          DEPLOY_SECRET: ${{ secrets.DEPLOY_HOOK_SECRET }}
          DEPLOY_URL: https://ad.gaoseafood.com/api/deploy-hook/xboard
          DEPLOY_STATUS_URL: https://ad.gaoseafood.com/api/deploy-hook/xboard/status
          REPOSITORY: ${{ github.repository }}
          REF: ${{ github.ref }}
          BEFORE_SHA: ${{ github.event.before }}
          TARGET_SHA: ${{ github.sha }}
          DELIVERY_ID: ${{ github.run_id }}
        run: |
          node --input-type=module <<'NODE'
          import { createHmac } from 'node:crypto'
          const secret = process.env.DEPLOY_SECRET
          if (!secret || secret.length < 32) throw new Error('deployment secret is not configured')
          const payload = {
            repository: { full_name: process.env.REPOSITORY },
            ref: process.env.REF,
            before: process.env.BEFORE_SHA,
            after: process.env.TARGET_SHA,
          }
          const body = JSON.stringify(payload)
          const signature = 'sha256=' + createHmac('sha256', secret).update(body).digest('hex')
          const accepted = await fetch(process.env.DEPLOY_URL, {
            method: 'POST',
            headers: {
              'content-type': 'application/json',
              'x-github-event': 'push',
              'x-github-delivery': process.env.DELIVERY_ID,
              'x-hub-signature-256': signature,
            },
            body,
          })
          const receipt = await accepted.json()
          if (!accepted.ok || receipt.queued !== true) throw new Error('server did not queue the deployment')
          const statusUrl = new URL(process.env.DEPLOY_STATUS_URL)
          statusUrl.searchParams.set('sha', process.env.TARGET_SHA)
          for (let attempt = 0; attempt < 120; attempt++) {
            const response = await fetch(statusUrl, { headers: { 'x-deploy-token': secret } })
            const state = await response.json()
            if (!response.ok) throw new Error('server deployment status could not be read')
            if (state.status === 'succeeded') {
              console.log('Production deployment succeeded for ' + state.sha)
              process.exit(0)
            }
            if (state.status === 'failed') throw new Error('Production deployment failed: ' + (state.message || 'see server deployment logs'))
            await new Promise(resolve => setTimeout(resolve, 10000))
          }
          throw new Error('Timed out waiting for the server deployment')
          NODE
